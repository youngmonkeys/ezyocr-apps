[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ezyocr"
version = "0.0.1"
description = "EzyOCR: nhận diện vận đơn bằng camera, OCR và cửa sổ ezyplatform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Young Monkeys", email = "ta.van.dung@youngmonkeys.org" }]
dependencies = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.0.0",
    "onnxruntime==1.23.2",
    "opencv-contrib-python==4.10.0.84",
    "zxing-cpp==3.1.1",
    "numpy",
    "pillow",
    "pywebview==6.2.1",
    "certifi",
    "pywin32; sys_platform == 'win32'",
    "PyGObject>=3.50,<3.51; sys_platform == 'linux'",
    "pycairo; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["briefcase==0.4.6"]
rapidocr = ["rapidocr>=3.0"]
apple-vision = ["pyobjc-framework-Vision==12.2.2; sys_platform == 'darwin'"]
windows-ocr = [
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
]
tesseract = ["pytesseract>=0.3.10"]

[project.scripts]
ezyocr = "ezyocr.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ezyocr = ["resources/*.json", "resources/i18n/*.json", "resources/*.html", "resources/*.png", "resources/models/**/*"]

[tool.briefcase]
project_name = "EzyOCR"
bundle = "org.youngmonkeys"

[tool.briefcase.app.ezyocr]
formal_name = "EzyOCR"
description = "EzyOCR: nhận diện vận đơn bằng camera, OCR và cửa sổ ezyplatform"
sources = ["src/ezyocr"]
icon = "packaging/icons/ezyocr"
permission.camera = "EzyOCR dùng camera để đọc nhãn vận đơn."

[tool.briefcase.app.ezyocr.macOS]
universal_build = false
min_os_version = "11.0"

[tool.briefcase.app.ezyocr.windows]
description = "EzyOCR: waybill recognition with camera, OCR and ezyplatform window"
requirement_installer_args = ["--no-binary", "proxy_tools"]

[tool.briefcase.app.ezyocr.linux]
description = "EzyOCR: waybill recognition with camera, OCR and ezyplatform window"
long_description = "Desktop app for warehouse stations: opens the ezyplatform station page, reads barcodes and OCRs waybill labels from the camera, then hands the results to the page and prints labels."

[tool.briefcase.app.ezyocr.linux.system.debian]
system_requires = [
    "pkg-config",
    "libcairo2-dev",
    "libgirepository-2.0-dev",
]
system_runtime_requires = [
    "libgirepository-2.0-0",
    "gir1.2-gtk-3.0",
    "gir1.2-webkit2-4.1",
    "libcanberra-gtk3-module",
    "libgl1",
    "libgomp1",
    "pulseaudio-utils",
    "sound-theme-freedesktop",
    "xclip",
    "wl-clipboard",
    "xdg-utils",
    "cups-client",
]
