<!doctype html>
<html lang="__HTML_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ server_unreachable.title }}</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #6b7280;
    --border: #d9dde4;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --error: #c62828;
    --error-soft: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181e;
      --card: #1e232b;
      --text: #e6e8ec;
      --muted: #9aa3b2;
      --border: #333a46;
      --accent: #4d8ff5;
      --error: #ef6b6b;
      --error-soft: #3a1f22;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: 460px; max-width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; box-shadow: 0 12px 32px rgba(0, 0, 0, .06); }
  .icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--error-soft); color: var(--error); margin-bottom: 14px; }
  .icon svg { width: 22px; height: 22px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 8px; color: var(--muted); }
  .url { display: block; margin: 12px 0 20px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--text); overflow-wrap: anywhere; unicode-bidi: plaintext; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button { padding: 9px 20px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-text); cursor: pointer; white-space: nowrap; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
  </div>
  <h1>{{ server_unreachable.title }}</h1>
  <p>{{ server_unreachable.message }}</p>
  <code class="url" id="admin-url"></code>
  <div class="actions">
    <button type="button" id="retry">{{ server_unreachable.retry }}</button>
    <button type="button" class="secondary" id="change-server">{{ server_unreachable.change_server }}</button>
  </div>
</div>
<script>
  const I18N = __I18N__;
  const t = (key) => I18N[key] || key;
  const $ = (id) => document.getElementById(id);

  async function init() {
    const state = await window.pywebview.api.get_setup_state();
    $("admin-url").textContent = state.admin_url || "";
  }

  $("retry").addEventListener("click", () => {
    $("retry").disabled = true;
    $("retry").textContent = t("server_unreachable.retrying");
    window.pywebview.api.open_station();
  });
  $("change-server").addEventListener("click", () => window.pywebview.api.open_setup());

  if (window.pywebview && window.pywebview.api) init();
  else window.addEventListener("pywebviewready", init);
</script>
</body>
</html>
